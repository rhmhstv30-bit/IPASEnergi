<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Belajar IPAS: Energi</title>
<style>
:root{
  --paper:#F4F6F3; --ink:#14284B; --ink-soft:#4A5A70; --line:#C9D2DC;
  --amber:#E8A317; --amber-ink:#14284B; --card:#FFFFFF; --grid:rgba(20,40,75,.07); --ok:#1E6B3A; --bad:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1B30; --ink:#E9EEF5; --ink-soft:#A8B5C6; --line:#2C3D58;
    --amber:#F0B33A; --amber-ink:#0F1B30; --card:#16253F; --grid:rgba(233,238,245,.06); --ok:#7BD59A; --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1B30; --ink:#E9EEF5; --ink-soft:#A8B5C6; --line:#2C3D58;
  --amber:#F0B33A; --amber-ink:#0F1B30; --card:#16253F; --grid:rgba(233,238,245,.06); --ok:#7BD59A; --bad:#FF8A80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;line-height:1.65;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,var(--ink) 14px 28px)}
.wrap{max-width:720px;margin:0 auto;padding:26px 20px 48px}
[hidden]{display:none!important}
.doc{font-size:.9rem;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:34px}
h1.welcome{font-size:clamp(2.1rem,8vw,3.2rem);line-height:1.1;margin:0 0 12px;font-style:italic;font-weight:700;letter-spacing:-.02em}
.sub{font-size:1.15rem;margin:0 0 30px;max-width:42ch}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:18px 18px 20px}
.sheet h2{font-size:1.1rem;margin:0 0 14px}
label{display:block;font-weight:700;font-size:.92rem;margin:12px 0 3px}
input[type=text],input:not([type]),select{width:100%;font:inherit;font-size:.95rem;padding:7px 10px;color:var(--ink);background:var(--paper);border:1px solid var(--ink-soft);border-radius:6px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.err{color:var(--bad);min-height:1.4em;margin:10px 0 0;font-size:.95rem}
.btn{font:inherit;font-weight:700;background:var(--amber);color:var(--amber-ink);border:1.5px solid var(--ink);padding:8px 20px;cursor:pointer;border-radius:6px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.sheet .btn{margin-top:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.who{margin:0;font-size:1rem;line-height:1.3}.who small{display:block;color:var(--ink-soft);font-size:.85rem}
.top .btn{padding:6px 14px;font-size:.9rem}
.ruler svg{width:100%;height:26px;display:block}
.prog{margin:4px 0 22px;font-size:.9rem;color:var(--ink-soft);font-style:italic}
h2.page{font-size:1.7rem;margin:0 0 8px;font-style:italic;line-height:1.25}
.lead{margin:0 0 18px;color:var(--ink-soft);max-width:56ch}
.box{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:6px;padding:12px 16px;margin:14px 0}
.box b{display:block;margin-bottom:4px}
.formula{font-size:1.5rem;font-style:italic;margin:6px 0}
.ph{border:1.5px dashed var(--ink-soft);border-radius:8px;min-height:190px;display:grid;place-items:center;text-align:center;padding:18px;color:var(--ink-soft);margin:16px 0;
  background:repeating-linear-gradient(-45deg,transparent 0 12px,var(--grid) 12px 13px)}
ul.t,ol.t{padding-left:22px;max-width:56ch}ul.t li,ol.t li{margin:6px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row input{max-width:160px}
.fb{margin:12px 0 0;min-height:1.5em;font-weight:700}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ink-soft);border-radius:6px;background:var(--card);padding:8px 12px;margin:8px 0;cursor:pointer}
.opt input{margin-top:6px}
.score{display:flex;gap:26px;margin:8px 0 0}.score span{display:block;font-size:.85rem;color:var(--ink-soft)}.score strong{font-size:1.6rem}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
.foot{margin-top:22px;font-size:.85rem;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .5s ease-out both}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Latar bertema energi (bergerak pelan) ===== */
:root{--panel:rgba(255,255,255,.94);--hill0:#E1E8EE;--hill1:#C4D0DB;--hill2:#D9E1E8;--hill3:#B3C2D0;--cloud:#E6ECF1;--tower:#5B6B80}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(22,37,63,.94);--hill0:#12223A;--hill1:#1E3252;--hill2:#162843;--hill3:#25406A;--cloud:#233A5E;--tower:#7F90A8}}
:root[data-theme="dark"]{--panel:rgba(22,37,63,.94);--hill0:#12223A;--hill1:#1E3252;--hill2:#162843;--hill3:#25406A;--cloud:#233A5E;--tower:#7F90A8}
.scene{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
#st{display:none}
@media (max-aspect-ratio:9/10){#sw{display:none}#st{display:block}}
.wrap{position:relative;z-index:1}
.stripe{position:relative;z-index:2}
.h0{fill:var(--hill0)}.t-f{fill:var(--tower)}.h1{fill:var(--hill1)}.h2{fill:var(--hill2)}.h3{fill:var(--hill3)}.cl{fill:var(--cloud)}
.a-f{fill:var(--amber)}.a-s{stroke:var(--amber)}.i-s{stroke:var(--ink)}.t-s{stroke:var(--tower)}
.aksi{display:flex;gap:8px}
main ~ .stripe{position:fixed;left:0;right:0;bottom:0;z-index:2}

@media (max-aspect-ratio:9/10){}

/* ===== Panel latar untuk teks supaya mudah dibaca ===== */
.wrap{margin:18px auto 44px;padding:24px 24px 30px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.sheet{background:var(--paper)}
@media (max-aspect-ratio:9/10){.wrap{margin:12px auto 150px;width:calc(100% - 24px);padding:20px 16px 24px}}
#v-login{margin:0 auto;padding:26px 20px 48px;background:none;border:none;border-radius:0}
#v-login .sheet{background:var(--card)}
@media (max-aspect-ratio:9/10){#v-login{padding:26px 8px 150px}}

/* ===== Tab posisi, embed, bagian isi ===== */
#v-app{max-width:820px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{flex:0 0 auto;font:inherit;font-size:.85rem;padding:6px 11px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.tab.done{color:var(--ink);border-color:var(--ink-soft)}
.tab.on{background:var(--amber);color:var(--amber-ink);border-color:var(--ink);font-weight:700}
.tab:disabled{opacity:.45;cursor:not-allowed}
.tab:hover:not(:disabled):not(.on){background:var(--paper)}
.tag{display:inline-block;margin-left:8px;padding:0 8px;font-size:.78rem;border:1px solid var(--ink-soft);border-radius:10px;color:var(--ink-soft);white-space:nowrap}
ul.tujuan li{margin:10px 0}
.canva{position:relative;width:100%;padding-top:56.25%;overflow:hidden;border-radius:8px;box-shadow:0 2px 8px rgba(63,69,81,.16);margin:14px 0 10px}
.canva iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.wg{display:flex;flex-direction:column;gap:8px;min-height:635px;margin:12px 0}
.wg iframe{flex:1;width:100%;border:0}
.credit{font-size:.85rem;color:var(--ink-soft);margin:6px 0}
.credit a{color:var(--ink)}
h3.bag{font-size:1.15rem;margin:26px 0 6px}
.soal p{margin:0 0 4px}
.soal .row{margin-top:8px}
dl.info{margin:0;max-width:60ch}dl.info dt{font-weight:700;margin-top:12px}dl.info dd{margin:2px 0 0;color:var(--ink-soft)}
.slider .sl-view{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:120px}
.slider .sl-view img{display:block;width:100%;height:auto}
.sl-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.sl-bar .btn{padding:6px 14px}.sl-bar .btn:disabled{opacity:.4;cursor:not-allowed}
#sl-no{font-size:.9rem;color:var(--ink-soft)}
</style>
</head>

var CANVA='<div class="canva"><iframe loading="lazy" title="Materi Jenis-jenis Energi" src="https://www.canva.com/design/DAHbVFcas_g/OhYsgj1nlgncCNtvvn-40A/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe></div>';

/* ===== Penampil slide materi dari gambar (aset/materi/slide (1).jpg, slide (2).jpg, ...) =====
   Jika gambar tidak ditemukan, yang tampil adalah embed Canva. */
function muatSlide(){
  var box=$("mat"); if(!box)return;
  function url(i,e){return encodeURI("aset/materi/slide ("+i+")."+e)}
  function coba(e,ok,gagal){var im=new Image();im.onload=ok;im.onerror=gagal;im.src=url(1,e)}
  coba("jpg",function(){mulai("jpg")},function(){coba("png",function(){mulai("png")},function(){})});
  function mulai(e){
    var cur=1,total=1,selesai=false;
    box.innerHTML='<div class="slider"><div class="sl-view"><img id="sl-img" alt="Slide materi"></div><div class="sl-bar"><button class="btn ghost" id="sl-prev">Sebelumnya</button><span id="sl-no"></span><button class="btn" id="sl-next">Berikutnya</button></div></div>';
    $("matcr").textContent="Materi dibuat dengan Canva.";
    function tampil(){
      if(!$("sl-img"))return;
      $("sl-img").src=url(cur,e);
      $("sl-no").textContent="Slide "+cur+" dari "+total+(selesai?"":"+");
      $("sl-prev").disabled=cur<=1; $("sl-next").disabled=cur>=total;
    }
    function cari(i){var t=new Image();t.onload=function(){total=i;tampil();cari(i+1)};t.onerror=function(){selesai=true;tampil()};t.src=url(i,e)}
    $("sl-prev").onclick=function(){if(cur>1){cur--;tampil()}};
    $("sl-next").onclick=function(){if(cur<total){cur++;tampil()}};
    window.slGeser=function(d){var n=cur+d;if(n>=1&&n<=total){cur=n;tampil()}};
    tampil();cari(2);
  }
}
document.addEventListener("keydown",function(e){
  if(!$("sl-img")||!window.slGeser||e.target.matches("input,select,textarea"))return;
  if(e.key==="ArrowRight")slGeser(1); if(e.key==="ArrowLeft")slGeser(-1);
});

function tabs(){

    var c=i==S.p?"on":(i<=S.max?"done":"");

  });
  $("tabs").innerHTML=h;
}
function render(){
  var p=S.p||0; if(S.max==null||S.max<p)S.max=p;
  tabs(); $("isi").innerHTML=HAL[p](); if(p==2)muatSlide();

function pindah(p){S.p=Math.max(0,Math.min(N,p));if(S.max==null||S.max<S.p)S.max=S.p;save();render();window.scrollTo(0,0)}
function keluar(){S={};save();$("nama").value="";$("absen").value="";$("kelas").value="";$("err").textContent="";show();window.scrollTo(0,0)}

$("lanjut").onclick=function(){if((S.p||0)==N)keluar();else pindah((S.p||0)+1)};

/* ===== Pengiriman data ke Google Form =====
   Alamat form dan kode kolom (entry) diambil dari link pra-pengisian.
   Jika kolom di form diubah/dibuat ulang, kode entry harus diperbarui. */
var FORM_URL="https://docs.google.com/forms/d/e/1FAIpQLSfJk8SsTCjcu2yxaoPipzzYZ8ZP4pWLqsUqbyncbPPlNUi_Bg/formResponse";
var KOLOM={nama:"entry.1283408016",absen:"entry.433066223",kelas:"entry.924447670",tahap:"entry.1182115751",skor:"entry.1764623562"};
var QKEY="energi_antrean";
function paket(d){var b=new URLSearchParams();for(var k in KOLOM)b.append(KOLOM[k],d[k]==null?"":d[k]);return b.toString()}
function kirimSatu(str){return fetch(FORM_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:str})}
function antre(){try{return JSON.parse(localStorage.getItem(QKEY))||[]}catch(e){return[]}}
function simpanAntre(a){try{localStorage.setItem(QKEY,JSON.stringify(a))}catch(e){}}
function kirimData(d){var s=paket(d);return kirimSatu(s).catch(function(){var a=antre();a.push(s);simpanAntre(a)})}
function kirimUlang(){var a=antre();if(!a.length)return;simpanAntre([]);a.forEach(function(s){kirimSatu(s).catch(function(){var b=antre();b.push(s);simpanAntre(b)})})}
window.addEventListener("online",kirimUlang);

/* ===== Suara klik lembut (Web Audio, tanpa file) ===== */
var SUARA=true,AC=null;
function pop(){
  if(!SUARA)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type="sine";o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(220,t+.09);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.1,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.12);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.14);
  }catch(e){}
}
document.addEventListener("click",function(e){if(e.target.closest("button"))pop()});
if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){["sw","st"].forEach(function(i){var s=$(i);if(s&&s.pauseAnimations)s.pauseAnimations()})}
