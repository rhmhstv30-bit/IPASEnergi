<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Belajar IPAS: Energi</title>
<style>
:root{
  --paper:#F4F6F3; --ink:#14284B; --ink-soft:#4A5A70; --line:#C9D2DC;
  --amber:#E8A317; --amber-ink:#14284B; --card:#FFFFFF; --grid:rgba(20,40,75,.07); --ok:#1E6B3A; --bad:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1B30; --ink:#E9EEF5; --ink-soft:#A8B5C6; --line:#2C3D58;
    --amber:#F0B33A; --amber-ink:#0F1B30; --card:#16253F; --grid:rgba(233,238,245,.06); --ok:#7BD59A; --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1B30; --ink:#E9EEF5; --ink-soft:#A8B5C6; --line:#2C3D58;
  --amber:#F0B33A; --amber-ink:#0F1B30; --card:#16253F; --grid:rgba(233,238,245,.06); --ok:#7BD59A; --bad:#FF8A80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;line-height:1.65;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,var(--ink) 14px 28px)}
.wrap{max-width:720px;margin:0 auto;padding:26px 20px 48px}
[hidden]{display:none!important}
.doc{font-size:.9rem;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:34px}
h1.welcome{font-size:clamp(2.1rem,8vw,3.2rem);line-height:1.1;margin:0 0 12px;font-style:italic;font-weight:700;letter-spacing:-.02em}
.sub{font-size:1.15rem;margin:0 0 30px;max-width:42ch}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:18px 18px 20px}
.sheet h2{font-size:1.1rem;margin:0 0 14px}
label{display:block;font-weight:700;font-size:.92rem;margin:12px 0 3px}
input[type=text],input:not([type]),select{width:100%;font:inherit;font-size:.95rem;padding:7px 10px;color:var(--ink);background:var(--paper);border:1px solid var(--ink-soft);border-radius:6px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.err{color:var(--bad);min-height:1.4em;margin:10px 0 0;font-size:.95rem}
.btn{font:inherit;font-weight:700;background:var(--amber);color:var(--amber-ink);border:1.5px solid var(--ink);padding:8px 20px;cursor:pointer;border-radius:6px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.sheet .btn{margin-top:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.who{margin:0;font-size:1rem;line-height:1.3}.who small{display:block;color:var(--ink-soft);font-size:.85rem}
.top .btn{padding:6px 14px;font-size:.9rem}
.ruler svg{width:100%;height:26px;display:block}
.prog{margin:4px 0 22px;font-size:.9rem;color:var(--ink-soft);font-style:italic}
h2.page{font-size:1.7rem;margin:0 0 8px;font-style:italic;line-height:1.25}
.lead{margin:0 0 18px;color:var(--ink-soft);max-width:56ch}
.box{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:6px;padding:12px 16px;margin:14px 0}
.box b{display:block;margin-bottom:4px}
.formula{font-size:1.5rem;font-style:italic;margin:6px 0}
.ph{border:1.5px dashed var(--ink-soft);border-radius:8px;min-height:190px;display:grid;place-items:center;text-align:center;padding:18px;color:var(--ink-soft);margin:16px 0;
  background:repeating-linear-gradient(-45deg,transparent 0 12px,var(--grid) 12px 13px)}
ul.t,ol.t{padding-left:22px;max-width:56ch}ul.t li,ol.t li{margin:6px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row input{max-width:160px}
.fb{margin:12px 0 0;min-height:1.5em;font-weight:700}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ink-soft);border-radius:6px;background:var(--card);padding:8px 12px;margin:8px 0;cursor:pointer}
.opt input{margin-top:6px}
.score{display:flex;gap:26px;margin:8px 0 0}.score span{display:block;font-size:.85rem;color:var(--ink-soft)}.score strong{font-size:1.6rem}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
.foot{margin-top:22px;font-size:.85rem;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .5s ease-out both}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Latar bertema energi (bergerak pelan) ===== */
:root{--hill0:#E1E8EE;--hill1:#C4D0DB;--hill2:#D9E1E8;--hill3:#B3C2D0;--cloud:#E6ECF1;--tower:#5B6B80}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hill0:#12223A;--hill1:#1E3252;--hill2:#162843;--hill3:#25406A;--cloud:#233A5E;--tower:#7F90A8}}
:root[data-theme="dark"]{--hill0:#12223A;--hill1:#1E3252;--hill2:#162843;--hill3:#25406A;--cloud:#233A5E;--tower:#7F90A8}
.scene{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
#st{display:none}
@media (max-aspect-ratio:9/10){#sw{display:none}#st{display:block}.wrap{padding-bottom:140px}}
.wrap{position:relative;z-index:1}
.stripe{position:relative;z-index:2}
.h0{fill:var(--hill0)}.t-f{fill:var(--tower)}.h1{fill:var(--hill1)}.h2{fill:var(--hill2)}.h3{fill:var(--hill3)}.cl{fill:var(--cloud)}
.a-f{fill:var(--amber)}.a-s{stroke:var(--amber)}.i-s{stroke:var(--ink)}.t-s{stroke:var(--tower)}
.aksi{display:flex;gap:8px}
main ~ .stripe{position:fixed;left:0;right:0;bottom:0;z-index:2}
.wrap{padding-bottom:56px}
@media (max-aspect-ratio:9/10){.wrap{padding-bottom:150px}}
</style>
</head>

<main class="wrap" id="v-login">
  <div class="doc">Lembar Kerja Siswa, IPAS Kelas X</div>
  <h1 class="welcome">Welcome</h1>
  <p class="sub">Mari belajar energi bersama. Isi data dirimu dulu untuk memulai ya.</p>
  <div class="sheet">
    <h2>Data Siswa</h2>
    <label for="nama">Nama lengkap</label><input id="nama" autocomplete="off">
    <label for="absen">Nomor absen</label><input id="absen" inputmode="numeric" maxlength="3" autocomplete="off">
    <label for="kelas">Kelas</label>
    <select id="kelas"><option value="">Pilih kelas</option><option>X PPLG 1</option><option>X PPLG 2</option><option>X Pengelasan</option><option>X Teknik Mesin</option><option>X Animasi</option><option>X DKV</option></select>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="masuk">Mulai belajar</button>
  </div>
</main>

<main class="wrap" id="v-app" hidden>
  <div class="top">
    <p class="who"><strong id="w-nama"></strong><small id="w-info"></small></p>
    <button class="btn ghost" id="keluar">Keluar</button>
  </div>
  <div id="bar"><div class="ruler" aria-hidden="true"><svg id="rule" viewBox="0 0 600 26" preserveAspectRatio="none"></svg></div><p class="prog" id="prog"></p></div>
  <div id="isi"></div>
  <div class="nav"><button class="btn ghost" id="kembali">Kembali</button><button class="btn" id="lanjut">Lanjut</button></div>
  <p class="foot">Contoh tampilan. Isi dan kalimat di tiap tahap masih draf.</p>
</main>
<div class="stripe" aria-hidden="true"></div>

<script>
var NAMA=["Tujuan Pembelajaran","Materi","Simulasi","Latihan Hitung","Game","Evaluasi Akhir"];
var KEY="energi_demo2",S={};
function $(i){return document.getElementById(i)}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var HAL=[
 function(){return '<h2 class="page">Halo, '+S.nama.split(" ")[0]+'. Siap belajar energi?</h2><p class="lead">Ada enam tahap yang akan kamu lewati.</p><ol class="t"><li>Tujuan Pembelajaran: apa yang akan kamu kuasai.</li><li>Materi: konsep dan rumus, dibagi per bagian kecil.</li><li>Simulasi: coba sendiri, ubah angkanya, lihat hasilnya.</li><li>Latihan Hitung: soal bertahap dengan umpan balik.</li><li>Game: tantangan berskor.</li><li>Evaluasi Akhir: cek sejauh mana kamu paham.</li></ol>'},
 function(){return '<h2 class="page">Apa yang Akan Kamu Capai</h2><p class="lead">Setelah belajar bagian ini, kamu bisa:</p><ul class="t"><li>Mengubah satuan massa, kecepatan, dan tinggi supaya siap dihitung.</li><li>Menghitung energi kinetik dan energi potensial.</li><li>Menyebutkan perubahan bentuk energi pada alat di sekitarmu.</li><li>Menghitung energi mekanik dan memakai kekekalannya.</li></ul><div class="box"><b>Kenapa ini penting?</b>Di bengkel, di lab komputer, bahkan di rumah, semua alat memakai dan mengubah energi. Paham hitungannya membantumu menilai alat itu dengan benar.</div>'},
 function(){return '<h2 class="page">Energi Kinetik</h2><p class="lead">Bagian 1 dari 4. Energi kinetik adalah energi yang dimiliki benda karena geraknya.</p><p>Makin berat bendanya dan makin cepat geraknya, makin besar energinya. Kecepatan punya pengaruh lebih besar, karena nilainya dikuadratkan.</p><div class="box"><b>Rumus</b><div class="formula">Ek = ½ · m · v²</div>Ek dalam joule (J), m massa dalam kg, v kecepatan dalam m/s.</div><div class="box"><b>Contoh di sekitarmu</b>Isi contoh kasus yang dekat dengan jurusan siswa di sini.</div>'},
 function(){return '<h2 class="page">Coba Sendiri di Simulasi</h2><p class="lead">Ubah nilainya, lalu perhatikan apa yang berubah.</p><div class="ph">Area simulasi<br>(bar energi dan benda bergerak muncul di sini)</div><ol class="t"><li>Atur massa benda, lalu catat energinya.</li><li>Naikkan tinggi awal. Tebak dulu sebelum menjalankan: energinya naik atau turun?</li><li>Bandingkan hasil simulasi dengan hitunganmu sendiri.</li></ol>'},
 function(){return '<h2 class="page">Latihan Hitung</h2><p class="lead">Soal 1 dari 5. Tulis jawabanmu dalam joule, angkanya saja.</p><div class="box"><b>Soal</b>Sebuah benda bermassa 2 kg bergerak dengan kecepatan 3 m/s. Berapa energi kinetiknya?</div><div class="row"><input id="jw" inputmode="decimal" aria-label="Jawaban"><span>J</span><button class="btn" id="cek">Periksa</button></div><p class="fb" id="fb" role="status"></p>'},
 function(){return '<h2 class="page">Tantangan Energi</h2><p class="lead">Selesaikan misi, kumpulkan skor.</p><div class="ph">Area game</div><div class="score"><div><span>Skor</span><strong>0</strong></div><div><span>Level</span><strong>1</strong></div></div>'},
 function(){return '<h2 class="page">Evaluasi Akhir</h2><p class="lead">Soal 1 dari 10. Pilih satu jawaban.</p><div class="box"><b>Soal</b>Isi soal pilihan ganda muncul di sini.</div><label class="opt"><input type="radio" name="o">Pilihan A</label><label class="opt"><input type="radio" name="o">Pilihan B</label><label class="opt"><input type="radio" name="o">Pilihan C</label><label class="opt"><input type="radio" name="o">Pilihan D</label>'},
 function(){return '<h2 class="page">Kerja bagus, '+S.nama.split(" ")[0]+'.</h2><p class="lead">Kamu sudah sampai di akhir. Skor dan hasilmu akan tampil di sini.</p><div class="score"><div><span>Skor akhir</span><strong>–</strong></div></div>'}
];
var N=HAL.length-1;

function render(){
  var p=S.p||0; $("isi").innerHTML=HAL[p]();
  var mid=p>=1&&p<=6; $("bar").hidden=!mid;
  if(mid){
    var r="";for(var k=0;k<=60;k++){var h=k%10==0?20:(k%5==0?14:8);r+='<line x1="'+(k*10)+'" y1="26" x2="'+(k*10)+'" y2="'+(26-h)+'" stroke="currentColor" stroke-width="1.2"/>'}
    $("rule").innerHTML='<rect x="0" y="0" width="'+(600*p/6)+'" height="26" fill="var(--amber)" opacity=".6"/>'+r; $("rule").style.color="var(--ink)";
    $("prog").textContent="Tahap "+p+" dari 6: "+NAMA[p-1];
  }
  $("kembali").style.visibility=p==0?"hidden":"visible";
  $("lanjut").textContent=p==0?"Mulai":(p==N?"Ulangi dari awal":(p==N-1?"Selesai":"Lanjut"));
  var c=$("cek"); if(c)c.onclick=cek;
}
function cek(){
  var v=parseFloat($("jw").value.replace(",",".")),f=$("fb");
  if(isNaN(v)){f.className="fb no";f.textContent="Isi dulu jawabanmu dengan angka.";return}
  var m={9:["ok","Tepat. Ek = ½ · 2 · 3² = 9 J."],18:["no","Hampir. Rumus Ek punya ½ di depan, jadi hasilmu perlu dibagi dua."],3:["no","Kecepatan harus dikuadratkan dulu: 3² = 9, baru dikalikan yang lain."],6:["no","Kamu mengalikan massa dan kecepatan. Energi kinetik memakai v², bukan v."]};
  var x=m[v]||["no","Belum tepat. Tulis rumusnya dulu, lalu masukkan angkanya satu per satu."];
  f.className="fb "+x[0];f.textContent=x[1];
}
function show(){
  var ok=S.nama&&S.absen&&S.kelas; $("v-login").hidden=!!ok; $("v-app").hidden=!ok;
  if(ok){$("w-nama").textContent=S.nama;$("w-info").textContent="Absen "+S.absen+", "+S.kelas;render()}
}
function go(d){S.p=Math.max(0,Math.min(N,(S.p||0)+d));save();render();window.scrollTo(0,0)}
$("lanjut").onclick=function(){if((S.p||0)==N){S.p=0;save();render();window.scrollTo(0,0)}else go(1)};
$("kembali").onclick=function(){go(-1)};
$("masuk").onclick=function(){
  var a=$("nama").value.trim(),b=$("absen").value.trim(),c=$("kelas").value;
  if(!a||!b||!c){$("err").textContent="Lengkapi nama, nomor absen, dan kelas sebelum masuk.";return}
  if(!/^\d{1,3}$/.test(b)){$("err").textContent="Nomor absen hanya berisi angka.";return}
  S={nama:a,absen:b,kelas:c,p:0};save();kirimData({nama:a,absen:b,kelas:c,tahap:"Masuk",skor:""});$("err").textContent="";show();window.scrollTo(0,0);
};
$("keluar").onclick=function(){S={};save();show();window.scrollTo(0,0)};

/* ===== Pengiriman data ke Google Form =====
   Alamat form dan kode kolom (entry) diambil dari link pra-pengisian.
   Jika kolom di form diubah/dibuat ulang, kode entry harus diperbarui. */
var FORM_URL="https://docs.google.com/forms/d/e/1FAIpQLSfJk8SsTCjcu2yxaoPipzzYZ8ZP4pWLqsUqbyncbPPlNUi_Bg/formResponse";
var KOLOM={nama:"entry.1283408016",absen:"entry.433066223",kelas:"entry.924447670",tahap:"entry.1182115751",skor:"entry.1764623562"};
var QKEY="energi_antrean";

function paket(d){var b=new URLSearchParams();for(var k in KOLOM)b.append(KOLOM[k],d[k]==null?"":d[k]);return b.toString()}
function kirimSatu(str){return fetch(FORM_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:str})}
function antre(){try{return JSON.parse(localStorage.getItem(QKEY))||[]}catch(e){return[]}}
function simpanAntre(a){try{localStorage.setItem(QKEY,JSON.stringify(a))}catch(e){}}

/* Kirim data. Jika gagal (misalnya tidak ada internet), simpan dulu di antrean. */
function kirimData(d){
  var s=paket(d);
  return kirimSatu(s).catch(function(){var a=antre();a.push(s);simpanAntre(a)});
}
/* Kirim ulang antrean saat internet kembali atau saat halaman dibuka lagi. */
function kirimUlang(){
  var a=antre(); if(!a.length)return; simpanAntre([]);
  a.forEach(function(s){kirimSatu(s).catch(function(){var b=antre();b.push(s);simpanAntre(b)})});
}
window.addEventListener("online",kirimUlang);

/* ===== Suara klik lembut (dibuat lewat Web Audio, tanpa file) ===== */
var SUARA=true,AC=null;
function pop(){
  if(!SUARA)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type="sine"; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(220,t+.09);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.1,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+.12);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.14);
  }catch(e){}
}
document.addEventListener("click",function(e){if(e.target.closest("button")||e.target.matches(".opt input"))pop()});

/* Hormati pengaturan "kurangi animasi" di perangkat */
if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){["sw","st"].forEach(function(i){var s=$(i);if(s&&s.pauseAnimations)s.pauseAnimations()})}

load();show();kirimUlang();
</script>
